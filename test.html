<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>반반이 퀴즈 테스트</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0f;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #0a0a0f;
    border-left: 1px solid #222;
    border-right: 1px solid #222;
  }

  /* ---------- 상단 컨트롤 버튼(전체화면/이전 단계) ---------- */
  #topBar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 70;
    display: flex; justify-content: flex-end; align-items: center;
    padding: 8px; pointer-events: none;
  }
  #backBtn { margin-right: auto; }
  .ctrlBtn {
    pointer-events: auto;
    background: rgba(20,20,28,0.7); color: #eaeaea; border: 1px solid #444;
    border-radius: 6px; width: 34px; height: 34px; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; cursor: pointer;
  }
  .ctrlBtn:active { background: #ff5a5f; color: #0a0a0f; }

  /* ---------- 문제에 딸린 이미지(링크) 보기 ---------- */
  #imageViewBtn {
    position: absolute; top: -12px; right: 10px;
    background: #2b2b38; color: #eaeaea; border: 1px solid #ff5a5f;
    font-size: 13px; padding: 2px 9px; border-radius: 10px;
    cursor: pointer; font-family: inherit;
  }
  #imageOverlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(5,5,8,0.94);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #imageOverlayImg {
    max-width: 100%; max-height: 100%; object-fit: contain;
    border-radius: 8px; border: 2px solid #ff5a5f;
  }

  /* ---------- 등장 연출(흰 화면 -> 검은 화면 그라데이션 후 사라짐) ---------- */
  #startScreen {
    position: absolute; inset: 0; z-index: 50;
    background: #fff;
    pointer-events: none;
    animation: introFade 1.4s ease forwards;
  }
  @keyframes introFade {
    0% { background: #ffffff; opacity: 1; }
    55% { background: #0a0a0f; opacity: 1; }
    100% { background: #0a0a0f; opacity: 0; }
  }
  #startScreen.ending {
    animation: outroFade 1.6s ease forwards;
  }
  @keyframes outroFade {
    0% { background: #0a0a0f; opacity: 0; }
    100% { background: #ffffff; opacity: 1; }
  }

  /* ---------- 캐릭터 스테이지 ---------- */
  #stage {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0;
    overflow: hidden;
    padding: 10px;
  }
  /* 캐릭터는 스테이지(#stage)가 실제로 남겨주는 공간을 그대로 채움.
     문제 유형이 바뀌어도 크기가 흔들리지 않도록, 스테이지 크기 자체를
     #inputArea의 최소 높이(숫자패드 기준)로 고정해두었음 */
  .sprite {
    height: 100%;
    max-height: 560px;
    width: auto;
    aspect-ratio: 384 / 702;
    background-image: url('emoticon/smile.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    image-rendering: -webkit-optimize-contrast;
    filter: drop-shadow(0 0 24px rgba(255,90,95,0.15));
  }

  /* ---------- 대사창 ---------- */
  #dialogueBox {
    margin: 0 10px 8px;
    background: rgba(18,18,26,0.92);
    border: 2px solid #ff5a5f;
    border-radius: 8px;
    padding: 10px 14px;
    min-height: 70px;
    flex-shrink: 0;
    position: relative;
  }
  #speakerTag {
    position: absolute; top: -12px; left: 10px;
    background: #ff5a5f; color: #0a0a0f;
    font-size: 11px; font-weight: bold;
    padding: 2px 10px; border-radius: 10px;
  }
  #dialogueText {
    color: #eaeaea; font-size: 15px; line-height: 1.6;
    white-space: pre-wrap; min-height: 48px; margin-top: 4px;
  }
  #skipHint {
    position: absolute; bottom: 6px; right: 10px;
    color: #555; font-size: 10px;
  }

  /* ---------- 입력 영역 ---------- */
  /* 숫자패드(가장 큰 입력 UI) 기준 높이를 항상 예약해둠 -> 문제 유형이
     바뀌어도(숫자/객관식/주관식) 스테이지 크기가 흔들리지 않음 */
  #inputArea {
    margin: 0 10px 8px;
    min-height: 210px;
    flex-shrink: 0;
  }
  .hidden { display: none !important; }

  #nameInputRow, #subjectiveInputRow { display: flex; gap: 8px; }
  #nameInput, #subjectiveInput {
    flex: 1;
    background: #16161e; border: 2px solid #333; border-radius: 6px;
    color: #eaeaea; font-size: 15px; padding: 10px 12px;
    font-family: inherit;
  }
  #nameInput:focus, #subjectiveInput:focus { outline: none; border-color: #ff5a5f; }
  #nameConfirm, #numConfirm, #subjectiveConfirm {
    background: #ff5a5f; color: #0a0a0f; border: none;
    border-radius: 6px; padding: 0 18px; font-size: 15px; font-weight: bold;
    font-family: inherit; cursor: pointer;
  }

  #numDisplay {
    background: #16161e; border: 2px solid #333; border-radius: 6px;
    color: #eaeaea; font-size: 18px; letter-spacing: 4px;
    padding: 7px 12px; text-align: center; min-height: 18px;
    margin-bottom: 6px;
  }
  #numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
  }
  .numBtn, #numClear, #numConfirm {
    background: #1c1c26; color: #eaeaea; border: 1px solid #333;
    border-radius: 6px; font-size: 17px; padding: 9px 0;
    font-family: inherit; cursor: pointer;
  }
  .numBtn:active, #numClear:active, #numConfirm:active { background: #ff5a5f; color: #0a0a0f; }
  #numConfirm { background: #ff5a5f; color: #0a0a0f; font-weight: bold; }
  #numClear { font-size: 14px; }

  #choiceButtons { display: flex; flex-direction: column; gap: 6px; }
  .choiceBtn {
    background: #1c1c26; color: #eaeaea; border: 1px solid #333;
    border-radius: 6px; font-size: 15px; padding: 11px 14px;
    text-align: left; font-family: inherit; cursor: pointer;
  }
  .choiceBtn:active { background: #ff5a5f; color: #0a0a0f; }

  /* ---------- 가로모드 안내 ---------- */
  #rotateNotice {
    position: fixed; inset: 0; z-index: 100;
    background: #0a0a0f; color: #eaeaea;
    display: none; align-items: center; justify-content: center;
    text-align: center; font-size: 16px; padding: 20px;
  }
  @media (orientation: landscape) {
    #rotateNotice { display: flex; }
  }
</style>
</head>
<body>

<div id="rotateNotice">📱 세로 화면으로 돌려주세요</div>

<div id="imageOverlay" class="hidden">
  <img id="imageOverlayImg" src="" alt="문제 이미지">
</div>

<div id="app">

  <div id="topBar">
    <button id="backBtn" class="ctrlBtn hidden" aria-label="이전 단계">◀</button>
    <button id="fullscreenBtn" class="ctrlBtn" aria-label="전체화면">⛶</button>
  </div>

  <div id="startScreen"></div>

  <div id="stage">
    <div class="sprite" id="charSprite"></div>
  </div>

  <div id="dialogueBox">
    <div id="speakerTag">반반이</div>
    <button id="imageViewBtn" class="hidden">🖼 그림</button>
    <div id="dialogueText"></div>
    <div id="skipHint">탭하여 스킵</div>
  </div>

  <div id="inputArea">
    <div id="nameInputRow" class="hidden">
      <input id="nameInput" type="text" placeholder="이름을 입력하세요" maxlength="8">
      <button id="nameConfirm">확인</button>
    </div>

    <div id="numpadArea" class="hidden">
      <div id="numDisplay"></div>
      <div id="numpad">
        <button class="numBtn" data-n="1">1</button>
        <button class="numBtn" data-n="2">2</button>
        <button class="numBtn" data-n="3">3</button>
        <button class="numBtn" data-n="4">4</button>
        <button class="numBtn" data-n="5">5</button>
        <button class="numBtn" data-n="6">6</button>
        <button class="numBtn" data-n="7">7</button>
        <button class="numBtn" data-n="8">8</button>
        <button class="numBtn" data-n="9">9</button>
        <button class="numBtn" data-n="0">0</button>
        <button id="numClear">지우기</button>
        <button id="numConfirm">확인</button>
      </div>
    </div>

    <div id="choiceArea" class="hidden">
      <div id="choiceButtons"></div>
    </div>

    <div id="subjectiveInputRow" class="hidden">
      <input id="subjectiveInput" type="text" placeholder="답을 입력하세요" maxlength="20">
      <button id="subjectiveConfirm">확인</button>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var charSprite = document.getElementById('charSprite');
  var dialogueBox = document.getElementById('dialogueBox');
  var dialogueText = document.getElementById('dialogueText');
  var nameInputRow = document.getElementById('nameInputRow');
  var nameInput = document.getElementById('nameInput');
  var nameConfirm = document.getElementById('nameConfirm');
  var numpadArea = document.getElementById('numpadArea');
  var numDisplay = document.getElementById('numDisplay');
  var numpad = document.getElementById('numpad');
  var numClear = document.getElementById('numClear');
  var numConfirm = document.getElementById('numConfirm');
  var choiceArea = document.getElementById('choiceArea');
  var choiceButtons = document.getElementById('choiceButtons');
  var subjectiveInputRow = document.getElementById('subjectiveInputRow');
  var subjectiveInput = document.getElementById('subjectiveInput');
  var subjectiveConfirm = document.getElementById('subjectiveConfirm');
  var startScreen = document.getElementById('startScreen');
  var backBtn = document.getElementById('backBtn');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var imageViewBtn = document.getElementById('imageViewBtn');
  var imageOverlay = document.getElementById('imageOverlay');
  var imageOverlayImg = document.getElementById('imageOverlayImg');

  var playerName = '';
  var numBuffer = '';
  var quizSteps = [];
  var currentStepIndex = -1;
  var stepHistory = [];
  var currentStepImage = null;

  /* ---------- 캐릭터 프레임 교차 재생 (2장씩 번갈아) ----------
     기본 대화형: idle1 ↔ idle3
     웃음: idle1 ↔ smile / 눈물: idle2 ↔ cry
     당황: idle3 ↔ embarrassed / 화남: idle4 ↔ angry
     정답/오답 반응은 다음 문제·대사로 넘어가기 전까지 계속 반복됨
  ---------------------------------------------------------- */
  var DEFAULT_PAIR = ['emoticon/idle1.png', 'emoticon/idle3.png'];
  var EMOTION_PAIRS = {
    '웃음': ['emoticon/idle1.png', 'emoticon/smile.png'],
    '눈물': ['emoticon/idle2.png', 'emoticon/cry.png'],
    '당황': ['emoticon/idle3.png', 'emoticon/embarrassed.png'],
    '화남': ['emoticon/idle4.png', 'emoticon/angry.png']
  };
  var pairTimer = null;
  var pairIndex = 0;

  function playPair(frames) {
    clearInterval(pairTimer);
    pairIndex = 0;
    charSprite.style.backgroundImage = "url('" + frames[0] + "')";
    pairTimer = setInterval(function () {
      pairIndex = (pairIndex + 1) % frames.length;
      charSprite.style.backgroundImage = "url('" + frames[pairIndex] + "')";
    }, 350);
  }

  playPair(DEFAULT_PAIR);

  /* 프레임 전환 시 깜빡임 없도록 미리 불러오기 */
  ['emoticon/idle1.png', 'emoticon/idle2.png', 'emoticon/idle3.png', 'emoticon/idle4.png', 'emoticon/smile.png', 'emoticon/cry.png', 'emoticon/embarrassed.png', 'emoticon/angry.png'].forEach(function (f) {
    var img = new Image();
    img.src = f;
  });

  /* ---------- 효과음 (Web Audio 합성 blip, 저작권 문제 없는 자체 생성 사운드) ---------- */
  var audioCtx = null;
  function unlockAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playBlip() {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'square';
    var freq = 320 + Math.random() * 140;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }
  function playSiren() {
    if (!audioCtx) return;
    var duration = 1.4;
    var sweeps = 3;
    var sweepTime = duration / sweeps;
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.12, now + 0.05);
    gain.gain.setValueAtTime(0.12, now + duration - 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    for (var i = 0; i < sweeps; i++) {
      var t0 = now + i * sweepTime;
      osc.frequency.setValueAtTime(600, t0);
      osc.frequency.linearRampToValueAtTime(1200, t0 + sweepTime / 2);
      osc.frequency.linearRampToValueAtTime(600, t0 + sweepTime);
    }
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }
  var SOUND_EFFECTS = { '사이렌': playSiren };

  /* ---------- 전체화면 버튼 ---------- */
  function toggleFullscreen() {
    var inFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!inFs) {
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }
  function updateFullscreenIcon() {
    var inFs = document.fullscreenElement || document.webkitFullscreenElement;
    fullscreenBtn.textContent = inFs ? '⤢' : '⛶';
  }
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', updateFullscreenIcon);
  document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

  /* ---------- 문제에 딸린 이미지(링크) 보기 ---------- */
  function updateImageButton(url) {
    currentStepImage = url || null;
    if (currentStepImage) imageViewBtn.classList.remove('hidden');
    else imageViewBtn.classList.add('hidden');
  }
  imageViewBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!currentStepImage) return;
    imageOverlayImg.src = currentStepImage;
    imageOverlay.classList.remove('hidden');
  });
  imageOverlay.addEventListener('click', function () {
    imageOverlay.classList.add('hidden');
  });

  /* ---------- 타이핑 대사 엔진 ---------- */
  var skipHint = document.getElementById('skipHint');
  var typingTimer = null;
  var isTyping = false;
  var awaitingContinue = false;
  var currentFullText = '';
  var currentOnComplete = null;

  function typeText(text, onComplete) {
    clearInterval(typingTimer);
    dialogueText.textContent = '';
    currentFullText = text;
    currentOnComplete = onComplete;
    isTyping = true;
    awaitingContinue = false;
    skipHint.textContent = '탭하여 스킵';
    var i = 0;
    typingTimer = setInterval(function () {
      var ch = text[i];
      dialogueText.textContent += ch;
      if (ch && ch !== ' ' && ch !== '\n') playBlip();
      i++;
      if (i >= text.length) {
        clearInterval(typingTimer);
        finishTyping();
      }
    }, 57);
  }

  function finishTyping() {
    isTyping = false;
    if (currentOnComplete) {
      awaitingContinue = true;
      skipHint.textContent = '탭하여 계속';
    }
  }

  dialogueBox.addEventListener('click', function () {
    if (isTyping) {
      clearInterval(typingTimer);
      dialogueText.textContent = currentFullText;
      finishTyping();
    } else if (awaitingContinue) {
      awaitingContinue = false;
      skipHint.textContent = '';
      var cb = currentOnComplete;
      currentOnComplete = null;
      if (cb) cb();
    }
  });

  /* ---------- quiz.txt 읽어오기 & 파싱 ----------
     블록 형식 (빈 줄로 구분):
       [대사]
       하고 싶은 말      (말하는 사람은 항상 반반이로 고정)
       효과음: 사이렌      (선택, 이 대사가 나올 때 효과음도 같이 재생. 현재 지원: 사이렌)
       링크: https://...      (선택, 이 대사에 그림을 붙이고 싶을 때 이미지 주소를 적으면 화면에 "🖼 그림" 버튼이 뜸)

       [숫자문제]
       문제: 4 x 9는 얼마일까?
       정답: 36
       정답반응: 웃음      (선택, 기본값 웃음 — 웃음/눈물/당황/화남 중 하나)
       오답반응: 화남      (선택, 기본값 화남 — 웃음/눈물/당황/화남 중 하나)
       링크: https://...      (선택, 문제에 그림을 붙이고 싶을 때 이미지 주소, 그림퀴즈의 웹 버전)

       [객관식문제]
       문제: 반반이가 좋아하는 색깔은?
       보기: 빨강, 파랑, 노랑
       정답: 빨강

       [주관식문제]
       문제: 반반이의 이름은 무엇일까?
       정답: 반반이, 반이
     (주관식은 띄어쓰기·대소문자 차이를 무시하고 채점, 정답은 쉼표로 여러 개 지정 가능 — 그 중 하나만 맞아도 정답 처리)
     대사·문제 텍스트 안에 %이름% 을 넣으면 플레이어 이름으로 치환됨
     줄 맨 앞에 ; 을 붙이면 그 줄은 주석 처리되어 무시됨 (예: ; 3번째 문제)
     링크는 이미지 주소만 지원(사진이 직접 보이는 링크여야 함, 예: 이미지 호스팅 사이트의 .jpg/.png 주소)
  --------------------------------------------------- */
  function parseQuizText(raw) {
    var blocks = raw.replace(/\r\n/g, '\n').split(/\n\s*\n/);
    var steps = [];
    blocks.forEach(function (block) {
      var lines = block.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0 && l.charAt(0) !== ';'; });
      if (lines.length === 0) return;
      var header = lines[0].match(/^\[(.+)\]$/);
      if (!header) return;
      var type = header[1].trim();
      var bodyLines = lines.slice(1);
      if (type === '대사') {
        var sound = null;
        var image = null;
        var textLines = [];
        bodyLines.forEach(function (line) {
          var idx = line.indexOf(':');
          var key = idx !== -1 ? line.slice(0, idx).trim() : '';
          if (key === '효과음') {
            sound = line.slice(idx + 1).trim();
          } else if (key === '링크') {
            image = line.slice(idx + 1).trim();
          } else {
            textLines.push(line);
          }
        });
        if (textLines.length === 0) return;
        steps.push({ type: 'dialogue', text: textLines.join('\n'), sound: sound, image: image });
        return;
      }
      var fields = {};
      bodyLines.forEach(function (line) {
        var idx = line.indexOf(':');
        if (idx === -1) return;
        var key = line.slice(0, idx).trim();
        var val = line.slice(idx + 1).trim();
        fields[key] = val;
      });
      var correctPair = EMOTION_PAIRS[fields['정답반응']] || EMOTION_PAIRS['웃음'];
      var wrongPair = EMOTION_PAIRS[fields['오답반응']] || EMOTION_PAIRS['화남'];
      var image = fields['링크'] ? fields['링크'].trim() : null;
      if (type === '숫자문제' && fields['문제'] && fields['정답'] !== undefined) {
        steps.push({ type: 'number', text: fields['문제'], answer: parseInt(fields['정답'], 10), correctPair: correctPair, wrongPair: wrongPair, image: image });
      } else if (type === '객관식문제' && fields['문제'] && fields['보기'] && fields['정답']) {
        var options = fields['보기'].split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
        steps.push({ type: 'choice', text: fields['문제'], options: options, answer: fields['정답'].trim(), correctPair: correctPair, wrongPair: wrongPair, image: image });
      } else if (type === '주관식문제' && fields['문제'] && fields['정답'] !== undefined) {
        var answers = fields['정답'].split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
        steps.push({ type: 'subjective', text: fields['문제'], answers: answers, correctPair: correctPair, wrongPair: wrongPair, image: image });
      } else {
        console.warn('quiz.txt: 인식할 수 없는 블록을 건너뜀 ->', block);
      }
    });
    return steps;
  }

  function withName(text) {
    return text.split('%이름%').join(playerName);
  }

  function normalizeAnswer(s) {
    return s.trim().toLowerCase();
  }

  /* ---------- 진행 흐름 ---------- */
  function step1_greeting() {
    typeText(
      '너.. 누구지? 이름이 뭐냐?',
      showNameInput
    );
  }

  function showNameInput() {
    nameInputRow.classList.remove('hidden');
    nameInput.value = '';
    nameInput.focus();
  }

  function submitName() {
    var v = nameInput.value.trim();
    if (!v) return;
    playerName = v;
    saveGlobalName(v);
    nameInputRow.classList.add('hidden');
    if (quizSteps.length === 0) {
      typeText('불러올 문제가 없다. ' + quizFile + '를 확인해봐라.', null);
      return;
    }
    goToStep(0);
  }
  nameConfirm.addEventListener('click', submitName);
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitName();
  });

  /* ---------- 이전 단계로 돌아가기 ---------- */
  function hideAllInputs() {
    numpadArea.classList.add('hidden');
    choiceArea.classList.add('hidden');
    subjectiveInputRow.classList.add('hidden');
  }

  function updateBackButton() {
    if (stepHistory.length > 1) backBtn.classList.remove('hidden');
    else backBtn.classList.add('hidden');
  }

  function goToStep(i) {
    stepHistory.push(i);
    playStep(i);
    updateBackButton();
  }

  function goBack() {
    if (stepHistory.length <= 1) return;
    stepHistory.pop();
    var prevIndex = stepHistory[stepHistory.length - 1];
    playStep(prevIndex);
    updateBackButton();
  }
  backBtn.addEventListener('click', goBack);

  function playEnding() {
    startScreen.classList.add('ending');
  }

  function playStep(i) {
    currentStepIndex = i;
    var step = quizSteps[i];
    var text = withName(step.text);
    hideAllInputs();
    updateImageButton(step.image);
    playPair(DEFAULT_PAIR);
    saveProgress(i);
    startScreen.classList.remove('ending');
    if (step.type === 'dialogue') {
      if (step.sound && SOUND_EFFECTS[step.sound]) SOUND_EFFECTS[step.sound]();
      var isLast = (i === quizSteps.length - 1);
      if (isLast) clearProgress();
      typeText(text, isLast ? playEnding : function () { goToStep(i + 1); });
    } else if (step.type === 'number') {
      typeText(text, function () { showNumpadFor(step); });
    } else if (step.type === 'choice') {
      typeText(text, function () { showChoicesFor(step); });
    } else if (step.type === 'subjective') {
      typeText(text, function () { showSubjectiveFor(step); });
    }
  }

  function advanceOrEnd(i) {
    if (i + 1 < quizSteps.length) {
      goToStep(i + 1);
    }
  }

  function onCorrect(i) {
    var step = quizSteps[i];
    playPair(step.correctPair);
    typeText('정답이다!', function () { advanceOrEnd(i); });
  }

  function onWrong(i, step) {
    playPair(step.wrongPair);
    typeText('오답이다. 다시 도전해봐!', function () {
      playPair(DEFAULT_PAIR);
      var text = withName(step.text);
      typeText(text, function () {
        if (step.type === 'number') showNumpadFor(step);
        else if (step.type === 'subjective') showSubjectiveFor(step);
        else showChoicesFor(step);
      });
    });
  }

  function showNumpadFor(step) {
    playPair(DEFAULT_PAIR);
    numBuffer = '';
    numDisplay.textContent = '';
    numpadArea.classList.remove('hidden');
  }

  numpad.addEventListener('click', function (e) {
    var btn = e.target.closest('.numBtn');
    if (!btn) return;
    if (numBuffer.length >= 5) return;
    numBuffer += btn.getAttribute('data-n');
    numDisplay.textContent = numBuffer;
  });

  numClear.addEventListener('click', function () {
    numBuffer = numBuffer.slice(0, -1);
    numDisplay.textContent = numBuffer;
  });

  numConfirm.addEventListener('click', function () {
    if (!numBuffer) return;
    numpadArea.classList.add('hidden');
    var step = quizSteps[currentStepIndex];
    var value = parseInt(numBuffer, 10);
    if (value === step.answer) onCorrect(currentStepIndex); else onWrong(currentStepIndex, step);
  });

  function showChoicesFor(step) {
    playPair(DEFAULT_PAIR);
    choiceButtons.innerHTML = '';
    step.options.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.className = 'choiceBtn';
      btn.textContent = opt;
      btn.addEventListener('click', function () {
        choiceArea.classList.add('hidden');
        if (opt === step.answer) onCorrect(currentStepIndex); else onWrong(currentStepIndex, step);
      });
      choiceButtons.appendChild(btn);
    });
    choiceArea.classList.remove('hidden');
  }

  function showSubjectiveFor(step) {
    playPair(DEFAULT_PAIR);
    subjectiveInput.value = '';
    subjectiveInputRow.classList.remove('hidden');
    subjectiveInput.focus();
  }

  function submitSubjective() {
    var v = subjectiveInput.value;
    if (!v.trim()) return;
    subjectiveInputRow.classList.add('hidden');
    var step = quizSteps[currentStepIndex];
    var isCorrect = step.answers.some(function (a) { return normalizeAnswer(v) === normalizeAnswer(a); });
    if (isCorrect) onCorrect(currentStepIndex); else onWrong(currentStepIndex, step);
  }
  subjectiveConfirm.addEventListener('click', submitSubjective);
  subjectiveInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitSubjective();
  });

  /* ---------- 중간에 창을 닫아도 이어할 수 있도록 진행 상황 저장 ---------- */
  var quizFile = new URLSearchParams(location.search).get('quiz') || 'quiz_phase1.txt';
  var PROGRESS_KEY = 'roomescape_progress_' + quizFile;
  var GLOBAL_NAME_KEY = 'roomescape_playerName';
  function saveProgress(i) {
    try {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify({ playerName: playerName, stepIndex: i }));
    } catch (e) {}
  }
  function loadProgress() {
    try {
      var raw = localStorage.getItem(PROGRESS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function clearProgress() {
    try { localStorage.removeItem(PROGRESS_KEY); } catch (e) {}
  }
  function saveGlobalName(name) {
    try { localStorage.setItem(GLOBAL_NAME_KEY, name); } catch (e) {}
  }
  function loadGlobalName() {
    try { return localStorage.getItem(GLOBAL_NAME_KEY) || ''; } catch (e) { return ''; }
  }

  /* ---------- 새 페이즈를 열면 이전 페이즈의 남은 진행 기록은 정리 ---------- */
  var PHASE_RESET_MAP = {
    'quiz_phase1.txt': ['quiz_phase2.txt', 'quiz_phase3.txt'],
    'quiz_phase2.txt': ['quiz_phase1.txt'],
    'quiz_phase3.txt': ['quiz_phase2.txt']
  };
  (PHASE_RESET_MAP[quizFile] || []).forEach(function (f) {
    try { localStorage.removeItem('roomescape_progress_' + f); } catch (e) {}
  });
  if (quizFile === 'quiz_phase1.txt') {
    try { localStorage.removeItem(GLOBAL_NAME_KEY); } catch (e) {}
  }

  /* ---------- 시작 버튼 없이 바로 진행, 첫 탭에서 소리 활성화 ---------- */
  document.addEventListener('click', unlockAudio, { once: true });
  document.addEventListener('touchstart', unlockAudio, { once: true });

  fetch(quizFile)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (raw) {
      quizSteps = parseQuizText(raw);
      var saved = loadProgress();
      if (saved && saved.stepIndex >= 0 && saved.stepIndex < quizSteps.length) {
        playerName = saved.playerName || '';
        goToStep(saved.stepIndex);
        return;
      }
      var existingName = loadGlobalName();
      if (existingName && quizSteps.length > 0) {
        playerName = existingName;
        goToStep(0);
      } else {
        step1_greeting();
      }
    })
    .catch(function (err) {
      console.error(err);
      dialogueText.textContent = quizFile + ' 파일을 불러오지 못했다. 같은 폴더에 파일이 있는지 확인해봐라.';
    });

})();
</script>
</body>
</html>
