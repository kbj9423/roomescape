<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>반반이 퀴즈 테스트</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0f;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100dvh;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #0a0a0f;
    border-left: 1px solid #222;
    border-right: 1px solid #222;
  }

  /* ---------- 시작 화면 ---------- */
  #startScreen {
    position: absolute; inset: 0; z-index: 50;
    background: #0a0a0f;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; text-align: center; padding: 20px;
  }
  #startScreen h1 { color: #ff5a5f; font-size: 22px; margin: 0; letter-spacing: 2px; }
  #startScreen p { color: #888; font-size: 13px; margin: 0; }
  #startBtn {
    background: #ff5a5f; color: #0a0a0f; border: none;
    padding: 14px 32px; font-size: 16px; font-weight: bold;
    border-radius: 6px; font-family: inherit; cursor: pointer;
  }

  /* ---------- 캐릭터 스테이지 ---------- */
  #stage {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0;
    overflow: hidden;
    padding: 16px;
  }
  .sprite {
    width: min(62vw, 300px);
    max-height: 100%;
    aspect-ratio: 384 / 702;
    background-image: url('idle_1.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    image-rendering: -webkit-optimize-contrast;
    filter: drop-shadow(0 0 24px rgba(255,90,95,0.15));
  }
  #emotionSprite {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background-image: url('emo_smile.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }

  /* ---------- 대사창 ---------- */
  #dialogueBox {
    margin: 0 10px 10px;
    background: rgba(18,18,26,0.92);
    border: 2px solid #ff5a5f;
    border-radius: 8px;
    padding: 12px 14px;
    min-height: 78px;
    position: relative;
  }
  #speakerTag {
    position: absolute; top: -12px; left: 10px;
    background: #ff5a5f; color: #0a0a0f;
    font-size: 11px; font-weight: bold;
    padding: 2px 10px; border-radius: 10px;
  }
  #dialogueText {
    color: #eaeaea; font-size: 15px; line-height: 1.6;
    white-space: pre-wrap; min-height: 48px; margin-top: 4px;
  }
  #skipHint {
    position: absolute; bottom: 6px; right: 10px;
    color: #555; font-size: 10px;
  }

  /* ---------- 입력 영역 ---------- */
  #inputArea {
    margin: 0 10px 14px;
    min-height: 64px;
  }
  .hidden { display: none !important; }

  #nameInputRow { display: flex; gap: 8px; }
  #nameInput {
    flex: 1;
    background: #16161e; border: 2px solid #333; border-radius: 6px;
    color: #eaeaea; font-size: 15px; padding: 10px 12px;
    font-family: inherit;
  }
  #nameInput:focus { outline: none; border-color: #ff5a5f; }
  #nameConfirm, #numConfirm {
    background: #ff5a5f; color: #0a0a0f; border: none;
    border-radius: 6px; padding: 0 18px; font-size: 15px; font-weight: bold;
    font-family: inherit; cursor: pointer;
  }

  #numDisplay {
    background: #16161e; border: 2px solid #333; border-radius: 6px;
    color: #eaeaea; font-size: 20px; letter-spacing: 4px;
    padding: 10px 12px; text-align: center; min-height: 20px;
    margin-bottom: 8px;
  }
  #numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .numBtn, #numClear, #numConfirm {
    background: #1c1c26; color: #eaeaea; border: 1px solid #333;
    border-radius: 6px; font-size: 18px; padding: 12px 0;
    font-family: inherit; cursor: pointer;
  }
  .numBtn:active, #numClear:active, #numConfirm:active { background: #ff5a5f; color: #0a0a0f; }
  #numConfirm { grid-column: span 3; background: #ff5a5f; color: #0a0a0f; font-weight: bold; }
  #numClear { grid-column: span 3; }

  /* ---------- 가로모드 안내 ---------- */
  #rotateNotice {
    position: fixed; inset: 0; z-index: 100;
    background: #0a0a0f; color: #eaeaea;
    display: none; align-items: center; justify-content: center;
    text-align: center; font-size: 16px; padding: 20px;
  }
  @media (orientation: landscape) {
    #rotateNotice { display: flex; }
  }
</style>
</head>
<body>

<div id="rotateNotice">📱 세로 화면으로 돌려주세요</div>

<div id="app">

  <div id="startScreen">
    <h1>반반이의 퀴즈</h1>
    <p>구조 테스트용 프로토타입</p>
    <button id="startBtn">게임 시작</button>
  </div>

  <div id="stage">
    <div class="sprite" id="idleSprite"></div>
    <div class="sprite" id="emotionSprite"></div>
  </div>

  <div id="dialogueBox">
    <div id="speakerTag">반반이</div>
    <div id="dialogueText"></div>
    <div id="skipHint">탭하여 스킵</div>
  </div>

  <div id="inputArea">
    <div id="nameInputRow" class="hidden">
      <input id="nameInput" type="text" placeholder="이름을 입력하세요" maxlength="8">
      <button id="nameConfirm">확인</button>
    </div>

    <div id="numpadArea" class="hidden">
      <div id="numDisplay"></div>
      <div id="numpad">
        <button class="numBtn" data-n="1">1</button>
        <button class="numBtn" data-n="2">2</button>
        <button class="numBtn" data-n="3">3</button>
        <button class="numBtn" data-n="4">4</button>
        <button class="numBtn" data-n="5">5</button>
        <button class="numBtn" data-n="6">6</button>
        <button class="numBtn" data-n="7">7</button>
        <button class="numBtn" data-n="8">8</button>
        <button class="numBtn" data-n="9">9</button>
        <button class="numBtn" data-n="0">0</button>
        <button id="numClear">지우기</button>
        <button id="numConfirm">확인</button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var idleSprite = document.getElementById('idleSprite');
  var emotionSprite = document.getElementById('emotionSprite');
  var dialogueBox = document.getElementById('dialogueBox');
  var dialogueText = document.getElementById('dialogueText');
  var nameInputRow = document.getElementById('nameInputRow');
  var nameInput = document.getElementById('nameInput');
  var nameConfirm = document.getElementById('nameConfirm');
  var numpadArea = document.getElementById('numpadArea');
  var numDisplay = document.getElementById('numDisplay');
  var numpad = document.getElementById('numpad');
  var numClear = document.getElementById('numClear');
  var numConfirm = document.getElementById('numConfirm');
  var startScreen = document.getElementById('startScreen');
  var startBtn = document.getElementById('startBtn');

  var playerName = '';
  var numBuffer = '';

  /* ---------- 캐릭터 idle 애니메이션 (정렬된 4프레임 순환) ---------- */
  var idleFrames = ['idle_1.png', 'idle_2.png', 'idle_3.png', 'idle_4.png'];
  var idleIndex = 0;
  setInterval(function () {
    idleIndex = (idleIndex + 1) % idleFrames.length;
    idleSprite.style.backgroundImage = "url('" + idleFrames[idleIndex] + "')";
  }, 350);

  /* ---------- 표정 피드백 ---------- */
  var emotionFrames = { smile: 'emo_smile.png', crying: 'emo_crying.png', embarrassed: 'emo_embarrassed.png', angry: 'emo_angry.png' };
  function showEmotion(type, ms) {
    emotionSprite.style.backgroundImage = "url('" + (emotionFrames[type] || emotionFrames.smile) + "')";
    emotionSprite.style.opacity = '1';
    clearTimeout(showEmotion._t);
    showEmotion._t = setTimeout(function () {
      emotionSprite.style.opacity = '0';
    }, ms || 1200);
  }

  /* 프레임 전환 시 깜빡임 없도록 미리 불러오기 */
  idleFrames.concat(Object.values(emotionFrames)).forEach(function (f) {
    var img = new Image();
    img.src = f;
  });

  /* ---------- 효과음 (Web Audio 합성 blip, 저작권 문제 없는 자체 생성 사운드) ---------- */
  var audioCtx = null;
  function unlockAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playBlip() {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'square';
    var freq = 320 + Math.random() * 140;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  /* ---------- 타이핑 대사 엔진 ---------- */
  var typingTimer = null;
  var isTyping = false;
  var currentFullText = '';
  var currentOnComplete = null;

  function typeText(text, onComplete) {
    clearInterval(typingTimer);
    dialogueText.textContent = '';
    currentFullText = text;
    currentOnComplete = onComplete;
    isTyping = true;
    var i = 0;
    typingTimer = setInterval(function () {
      var ch = text[i];
      dialogueText.textContent += ch;
      if (ch && ch !== ' ' && ch !== '\n') playBlip();
      i++;
      if (i >= text.length) {
        clearInterval(typingTimer);
        finishTyping();
      }
    }, 40);
  }

  function finishTyping() {
    isTyping = false;
    var cb = currentOnComplete;
    currentOnComplete = null;
    if (cb) cb();
  }

  dialogueBox.addEventListener('click', function () {
    if (isTyping) {
      clearInterval(typingTimer);
      dialogueText.textContent = currentFullText;
      finishTyping();
    }
  });

  /* ---------- 진행 흐름 ---------- */
  function step1_greeting() {
    typeText(
      '안녕? 나는 반반이라고 한다. 너에게 퀴즈를 내겠다.\n게임을 시작하기 전에 너의 이름을 입력해라.',
      showNameInput
    );
  }

  function showNameInput() {
    nameInputRow.classList.remove('hidden');
    nameInput.value = '';
    nameInput.focus();
  }

  function submitName() {
    var v = nameInput.value.trim();
    if (!v) return;
    playerName = v;
    nameInputRow.classList.add('hidden');
    step2_confirmAndQuiz();
  }
  nameConfirm.addEventListener('click', submitName);
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitName();
  });

  function step2_confirmAndQuiz() {
    typeText(
      "좋다. '" + playerName + "' 이제부터 퀴즈를 시작하지.\n너의 실력부터 보자. 4 × 9는? 정답을 입력해라.",
      showNumpad
    );
  }

  function showNumpad() {
    numBuffer = '';
    numDisplay.textContent = '';
    numpadArea.classList.remove('hidden');
  }

  numpad.addEventListener('click', function (e) {
    var btn = e.target.closest('.numBtn');
    if (!btn) return;
    if (numBuffer.length >= 3) return;
    numBuffer += btn.getAttribute('data-n');
    numDisplay.textContent = numBuffer;
  });

  numClear.addEventListener('click', function () {
    numBuffer = numBuffer.slice(0, -1);
    numDisplay.textContent = numBuffer;
  });

  numConfirm.addEventListener('click', function () {
    if (!numBuffer) return;
    numpadArea.classList.add('hidden');
    checkAnswer(parseInt(numBuffer, 10));
  });

  function checkAnswer(value) {
    if (value === 36) {
      showEmotion('smile', 1400);
      typeText('정답! 잘하는구나, ' + playerName + '.\n오늘 테스트는 여기까지다.', null);
    } else {
      showEmotion('angry', 1400);
      typeText('오답이다. 다시 도전해봐!', showNumpad);
    }
  }

  /* ---------- 시작 버튼 ---------- */
  startBtn.addEventListener('click', function () {
    unlockAudio();
    startScreen.style.display = 'none';
    step1_greeting();
  });

})();
</script>
</body>
</html>
