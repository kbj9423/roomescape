<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>반반이 퀴즈 테스트</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0f;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    position: relative;
    background: #0a0a0f;
    border-left: 1px solid #222;
    border-right: 1px solid #222;
  }

  /* ---------- 시작 화면 ---------- */
  #startScreen {
    position: absolute; inset: 0; z-index: 50;
    background: #0a0a0f;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; text-align: center; padding: 20px;
  }
  #startScreen h1 { color: #ff5a5f; font-size: 22px; margin: 0; letter-spacing: 2px; }
  #startScreen p { color: #888; font-size: 13px; margin: 0; }
  #startBtn {
    background: #ff5a5f; color: #0a0a0f; border: none;
    padding: 14px 32px; font-size: 16px; font-weight: bold;
    border-radius: 6px; font-family: inherit; cursor: pointer;
  }

  /* ---------- 캐릭터 스테이지 ---------- */
  #stage {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0;
    max-height: 100%;
    overflow: hidden;
    padding: 10px;
    transition: max-height 0.35s ease, opacity 0.3s ease;
  }
  .sprite {
    height: min(38vh, 300px);
    width: auto;
    aspect-ratio: 384 / 702;
    background-image: url('smile.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    image-rendering: -webkit-optimize-contrast;
    filter: drop-shadow(0 0 24px rgba(255,90,95,0.15));
    transition: transform 0.35s ease;
  }
  /* 입력창(이름/숫자패드)이 뜨면 캐릭터가 위로 날아가며 사라지고, 문제·답·키패드만 남김 */
  #app.inputActive #stage {
    max-height: 0;
    opacity: 0;
  }
  #app.inputActive .sprite {
    transform: translateY(-60px);
  }

  /* ---------- 대사창 ---------- */
  #dialogueBox {
    margin: 0 10px 8px;
    background: rgba(18,18,26,0.92);
    border: 2px solid #ff5a5f;
    border-radius: 8px;
    padding: 10px 14px;
    min-height: 70px;
    position: relative;
  }
  #speakerTag {
    position: absolute; top: -12px; left: 10px;
    background: #ff5a5f; color: #0a0a0f;
    font-size: 11px; font-weight: bold;
    padding: 2px 10px; border-radius: 10px;
  }
  #dialogueText {
    color: #eaeaea; font-size: 15px; line-height: 1.6;
    white-space: pre-wrap; min-height: 48px; margin-top: 4px;
  }
  #skipHint {
    position: absolute; bottom: 6px; right: 10px;
    color: #555; font-size: 10px;
  }

  /* ---------- 입력 영역 ---------- */
  #inputArea {
    margin: 0 10px 8px;
    min-height: 64px;
  }
  /* 캐릭터가 사라져 비는 공간을, 입력 영역이 커지면서 그대로 채우도록 함 */
  #app.inputActive #inputArea {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .hidden { display: none !important; }

  #nameInputRow { display: flex; gap: 8px; }
  #nameInput {
    flex: 1;
    background: #16161e; border: 2px solid #333; border-radius: 6px;
    color: #eaeaea; font-size: 15px; padding: 10px 12px;
    font-family: inherit;
  }
  #nameInput:focus { outline: none; border-color: #ff5a5f; }
  #nameConfirm, #numConfirm {
    background: #ff5a5f; color: #0a0a0f; border: none;
    border-radius: 6px; padding: 0 18px; font-size: 15px; font-weight: bold;
    font-family: inherit; cursor: pointer;
  }

  #numDisplay {
    background: #16161e; border: 2px solid #333; border-radius: 6px;
    color: #eaeaea; font-size: 18px; letter-spacing: 4px;
    padding: 7px 12px; text-align: center; min-height: 18px;
    margin-bottom: 6px;
  }
  #numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
  }
  .numBtn, #numClear, #numConfirm {
    background: #1c1c26; color: #eaeaea; border: 1px solid #333;
    border-radius: 6px; font-size: 17px; padding: 9px 0;
    font-family: inherit; cursor: pointer;
  }
  .numBtn:active, #numClear:active, #numConfirm:active { background: #ff5a5f; color: #0a0a0f; }
  #numConfirm { background: #ff5a5f; color: #0a0a0f; font-weight: bold; }
  #numClear { font-size: 14px; }

  /* ---------- 가로모드 안내 ---------- */
  #rotateNotice {
    position: fixed; inset: 0; z-index: 100;
    background: #0a0a0f; color: #eaeaea;
    display: none; align-items: center; justify-content: center;
    text-align: center; font-size: 16px; padding: 20px;
  }
  @media (orientation: landscape) {
    #rotateNotice { display: flex; }
  }
</style>
</head>
<body>

<div id="rotateNotice">📱 세로 화면으로 돌려주세요</div>

<div id="app">

  <div id="startScreen">
    <h1>반반이의 퀴즈</h1>
    <p>구조 테스트용 프로토타입</p>
    <button id="startBtn">게임 시작</button>
  </div>

  <div id="stage">
    <div class="sprite" id="charSprite"></div>
  </div>

  <div id="dialogueBox">
    <div id="speakerTag">반반이</div>
    <div id="dialogueText"></div>
    <div id="skipHint">탭하여 스킵</div>
  </div>

  <div id="inputArea">
    <div id="nameInputRow" class="hidden">
      <input id="nameInput" type="text" placeholder="이름을 입력하세요" maxlength="8">
      <button id="nameConfirm">확인</button>
    </div>

    <div id="numpadArea" class="hidden">
      <div id="numDisplay"></div>
      <div id="numpad">
        <button class="numBtn" data-n="1">1</button>
        <button class="numBtn" data-n="2">2</button>
        <button class="numBtn" data-n="3">3</button>
        <button class="numBtn" data-n="4">4</button>
        <button class="numBtn" data-n="5">5</button>
        <button class="numBtn" data-n="6">6</button>
        <button class="numBtn" data-n="7">7</button>
        <button class="numBtn" data-n="8">8</button>
        <button class="numBtn" data-n="9">9</button>
        <button class="numBtn" data-n="0">0</button>
        <button id="numClear">지우기</button>
        <button id="numConfirm">확인</button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var appEl = document.getElementById('app');
  var charSprite = document.getElementById('charSprite');
  var dialogueBox = document.getElementById('dialogueBox');
  var dialogueText = document.getElementById('dialogueText');
  var nameInputRow = document.getElementById('nameInputRow');
  var nameInput = document.getElementById('nameInput');
  var nameConfirm = document.getElementById('nameConfirm');
  var numpadArea = document.getElementById('numpadArea');
  var numDisplay = document.getElementById('numDisplay');
  var numpad = document.getElementById('numpad');
  var numClear = document.getElementById('numClear');
  var numConfirm = document.getElementById('numConfirm');
  var startScreen = document.getElementById('startScreen');
  var startBtn = document.getElementById('startBtn');

  var playerName = '';
  var numBuffer = '';

  /* ---------- 캐릭터 프레임 교차 재생 (2장씩 번갈아) ----------
     기본 대화형: idle1 ↔ idle3
     웃음(정답): idle1 ↔ smile / 우는 것: idle2 ↔ cry
     당황: idle3 ↔ embarrassed / 화남(오답): idle4 ↔ angry
  ---------------------------------------------------------- */
  var DEFAULT_PAIR = ['idle1.png', 'idle3.png'];
  var pairTimer = null;
  var pairIndex = 0;
  var revertTimer = null;

  function playPair(frames) {
    clearInterval(pairTimer);
    pairIndex = 0;
    charSprite.style.backgroundImage = "url('" + frames[0] + "')";
    pairTimer = setInterval(function () {
      pairIndex = (pairIndex + 1) % frames.length;
      charSprite.style.backgroundImage = "url('" + frames[pairIndex] + "')";
    }, 350);
  }

  function reactAndReturn(frames, ms) {
    clearTimeout(revertTimer);
    playPair(frames);
    revertTimer = setTimeout(function () {
      playPair(DEFAULT_PAIR);
    }, ms || 1400);
  }

  playPair(DEFAULT_PAIR);

  /* 프레임 전환 시 깜빡임 없도록 미리 불러오기 */
  ['idle1.png', 'idle2.png', 'idle3.png', 'idle4.png', 'smile.png', 'cry.png', 'embarrassed.png', 'angry.png'].forEach(function (f) {
    var img = new Image();
    img.src = f;
  });

  /* ---------- 효과음 (Web Audio 합성 blip, 저작권 문제 없는 자체 생성 사운드) ---------- */
  var audioCtx = null;
  function unlockAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playBlip() {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'square';
    var freq = 320 + Math.random() * 140;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  /* ---------- 타이핑 대사 엔진 ---------- */
  var skipHint = document.getElementById('skipHint');
  var typingTimer = null;
  var isTyping = false;
  var awaitingContinue = false;
  var currentFullText = '';
  var currentOnComplete = null;

  function typeText(text, onComplete) {
    clearInterval(typingTimer);
    dialogueText.textContent = '';
    currentFullText = text;
    currentOnComplete = onComplete;
    isTyping = true;
    awaitingContinue = false;
    skipHint.textContent = '탭하여 스킵';
    var i = 0;
    typingTimer = setInterval(function () {
      var ch = text[i];
      dialogueText.textContent += ch;
      if (ch && ch !== ' ' && ch !== '\n') playBlip();
      i++;
      if (i >= text.length) {
        clearInterval(typingTimer);
        finishTyping();
      }
    }, 57);
  }

  function finishTyping() {
    isTyping = false;
    if (currentOnComplete) {
      awaitingContinue = true;
      skipHint.textContent = '탭하여 계속';
    }
  }

  dialogueBox.addEventListener('click', function () {
    if (isTyping) {
      clearInterval(typingTimer);
      dialogueText.textContent = currentFullText;
      finishTyping();
    } else if (awaitingContinue) {
      awaitingContinue = false;
      skipHint.textContent = '';
      var cb = currentOnComplete;
      currentOnComplete = null;
      if (cb) cb();
    }
  });

  /* ---------- 진행 흐름 ---------- */
  function step1_greeting() {
    typeText(
      '안녕? 나는 반반이라고 한다. 너에게 퀴즈를 내겠다.\n게임을 시작하기 전에 너의 이름을 입력해라.',
      showNameInput
    );
  }

  function showNameInput() {
    nameInputRow.classList.remove('hidden');
    appEl.classList.add('inputActive');
    nameInput.value = '';
    nameInput.focus();
  }

  function submitName() {
    var v = nameInput.value.trim();
    if (!v) return;
    playerName = v;
    nameInputRow.classList.add('hidden');
    appEl.classList.remove('inputActive');
    step2_confirmAndQuiz();
  }
  nameConfirm.addEventListener('click', submitName);
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitName();
  });

  function step2_confirmAndQuiz() {
    typeText(
      "좋다. '" + playerName + "' 이제부터 퀴즈를 시작하지.\n너의 실력부터 보자. 4 × 9는? 정답을 입력해라.",
      showNumpad
    );
  }

  function showNumpad() {
    numBuffer = '';
    numDisplay.textContent = '';
    numpadArea.classList.remove('hidden');
    appEl.classList.add('inputActive');
  }

  numpad.addEventListener('click', function (e) {
    var btn = e.target.closest('.numBtn');
    if (!btn) return;
    if (numBuffer.length >= 3) return;
    numBuffer += btn.getAttribute('data-n');
    numDisplay.textContent = numBuffer;
  });

  numClear.addEventListener('click', function () {
    numBuffer = numBuffer.slice(0, -1);
    numDisplay.textContent = numBuffer;
  });

  numConfirm.addEventListener('click', function () {
    if (!numBuffer) return;
    numpadArea.classList.add('hidden');
    appEl.classList.remove('inputActive');
    checkAnswer(parseInt(numBuffer, 10));
  });

  function checkAnswer(value) {
    if (value === 36) {
      reactAndReturn(['idle1.png', 'smile.png'], 1400);
      typeText('정답! 잘하는구나, ' + playerName + '.\n오늘 테스트는 여기까지다.', null);
    } else {
      reactAndReturn(['idle4.png', 'angry.png'], 1400);
      typeText('오답이다. 다시 도전해봐!', showNumpad);
    }
  }

  /* ---------- 시작 버튼 ---------- */
  startBtn.addEventListener('click', function () {
    unlockAudio();
    startScreen.style.display = 'none';
    step1_greeting();
  });

})();
</script>
</body>
</html>
